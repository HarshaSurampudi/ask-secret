name: release

# Push a tag like v0.2.0 to build every platform and publish a GitHub release.
# Running it by hand builds the same files as artifacts, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
      # musl gives a static binary that runs on any distro.
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist pkg
          cp target/${{ matrix.target }}/release/ask-secret README.md LICENSE pkg/
          tar -czf dist/ask-secret-${{ matrix.name }}.tar.gz -C pkg .
          cd dist && sha256sum ask-secret-${{ matrix.name }}.tar.gz > ask-secret-${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --release
      - name: Build universal binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p pkg
          lipo -create -output pkg/ask-secret \
            target/aarch64-apple-darwin/release/ask-secret target/x86_64-apple-darwin/release/ask-secret
          cd macos
          swift build -c release --arch arm64 --arch x86_64
          cp "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/ask-secret-ui" ../pkg/
      - name: Package
        run: |
          # Ad-hoc signatures; Apple Silicon refuses to run unsigned binaries.
          codesign -f -s - pkg/ask-secret pkg/ask-secret-ui
          cp README.md LICENSE pkg/
          mkdir -p dist
          tar -czf dist/ask-secret-macos-universal.tar.gz -C pkg .
          cd dist && shasum -a 256 ask-secret-macos-universal.tar.gz > ask-secret-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
