[package]
name = "ask-secret"
version = "0.2.0"
edition = "2021"
description = "A local secret vault for AI agents: they ask, you type, they never see the value."
license = "MIT"

[[bin]]
name = "ask-secret"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
strip = true
lto = true
